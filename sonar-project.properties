sonar.projectKey=nangman-crypto-recomposition-orchestrator
sonar.projectName=nangman-crypto-recomposition-orchestrator
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src,ecs,.github/workflows
sonar.tests=src
sonar.test.inclusions=src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs
sonar.exclusions=target/**,sonar-reports/**,src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs
sonar.coverage.exclusions=ecs/**,.github/**,src/main.rs,src/io/read.rs,src/io/write.rs,src/**/tests.rs,src/**/tests/*.rs,src/**/tests/**/*.rs,src/**/*_tests.rs

sonar.rust.cargo.manifestPaths=Cargo.toml
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=sonar-reports/clippy.json
sonar.rust.lcov.reportPaths=sonar-reports/lcov.info
