sonar.projectKey=nangman-crypto-recomposition-orchestrator
sonar.projectName=nangman-crypto-recomposition-orchestrator
sonar.sourceEncoding=UTF-8

sonar.sources=src,ecs,.github/workflows
sonar.exclusions=target/**,sonar-reports/**
sonar.coverage.exclusions=ecs/**,.github/**

sonar.rust.cargo.manifestPaths=Cargo.toml
sonar.rust.clippy.enable=false
sonar.rust.clippy.reportPaths=sonar-reports/clippy.json
sonar.rust.lcov.reportPaths=sonar-reports/lcov.info
